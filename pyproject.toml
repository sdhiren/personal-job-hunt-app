[project]
name = "jobhunt"
version = "0.1.0"
description = "Personal job scraper, matcher, auto-applier and local application tracker"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "beautifulsoup4>=4.12",
    "pypdf>=4.2",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "playwright>=1.45",
    "anthropic>=1.0",
    "python-multipart>=0.0.9",
    "psycopg[binary,pool]>=3.2",
    "python-dotenv>=1.0",
]

[project.scripts]
jobhunt = "jobhunt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobhunt"]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # typer declares CLI options via calls in defaults
