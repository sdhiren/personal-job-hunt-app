<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jobhunt</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232e8b57'/%3E%3Cpath d='M9 17c5-1 9-5 13-9-1 7-5 13-13 14' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 14c4-1 8-4 12-9-1 7-5 13-12 14"/></svg></span>jobhunt</div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">Everything stays on this computer.<br>Data folder: <code>data/</code></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <h1 id="title">Dashboard</h1>
      <div class="grow"></div>
      <span id="applyind" hidden></span>
      <a id="claudepill" class="pill" href="#/settings" title="Claude connection"><span class="dot"></span><span>Claude…</span></a>
      <button class="btn primary" id="findbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Find jobs</button>
    </header>
    <main class="page" id="page"></main>
  </div>
</div>
<div id="taskpanel" class="card taskpanel" hidden></div>
<div class="toasts" id="toasts"></div>
<div id="drawer-root"></div>
<div id="tip" class="tip" hidden></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
